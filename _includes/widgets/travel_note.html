{% if include.item.photo %}
<img src="{{ include.item.photo | relative_url }}" alt="{{ include.item.photo_alt }}" class="w-100 rounded-xl-top travel-photo" loading="lazy">
{% endif %}
<div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-2 small">
        <span class="badge badge-pill {% if include.item.upcoming %}badge-light{% else %}badge-secondary{% endif %}">{{ include.item.event }}</span>
        <span class="text-muted">{{ include.item.when }}</span>
    </div>
    <h3 class="card-title h5"><span aria-hidden="true">{{ include.item.flag }}</span> {{ include.item.city }}</h3>
    <p class="text-muted small mb-3"><i class="fas fa-map-marker-alt mr-1" aria-hidden="true"></i>{{ include.item.country }}</p>
    <p class="card-text small mb-0">{{ include.item.note }}</p>
    {% if include.item.upcoming %}<p class="small text-muted mt-3 mb-0"><i class="far fa-calendar-alt mr-1" aria-hidden="true"></i>Upcoming</p>{% endif %}
</div>
