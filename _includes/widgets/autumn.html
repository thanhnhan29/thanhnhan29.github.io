<div class="autumn-leaves" aria-hidden="true" hidden>
    {% for leaf in (1..10) %}
    <span class="autumn-leaf autumn-leaf-{{ leaf }}">
        <svg viewBox="0 0 32 44" focusable="false" aria-hidden="true">
            <path fill="currentColor" d="M16 2C5 9 2 18 6 27c2 5 6 8 10 9 5-3 10-7 11-13C29 14 22 6 16 2Z"/>
            <path d="M16 7v33M16 18l-6-5m6 12 7-7m-7 12-6-5" fill="none" stroke="#8c662f" stroke-width="1" stroke-linecap="round"/>
        </svg>
    </span>
    {% endfor %}
</div>
<button class="autumn-toggle" type="button" aria-pressed="false" hidden>
    <svg viewBox="0 0 32 44" focusable="false" aria-hidden="true">
        <path fill="currentColor" d="M16 2C5 9 2 18 6 27c2 5 6 8 10 9 5-3 10-7 11-13C29 14 22 6 16 2Z"/>
        <path d="M16 7v33" fill="none" stroke="currentColor" stroke-width="1"/>
    </svg>
    <span>Autumn</span>
</button>
<script defer src="{{ '/assets/js/autumn.js' | relative_url }}"></script>
