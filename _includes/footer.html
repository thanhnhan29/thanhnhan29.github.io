<footer class="footer flex-shrink-0 border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-md-3">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col-md-9">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }} ·
                    <button type="button" class="visitor-map-toggle text-primary" aria-expanded="false" aria-controls="visitor-map-panel">Visitor Map</button>
                </div>
            </div>
        </div>
        {% include widgets/visitor_map.html %}
    </div>
</footer>
